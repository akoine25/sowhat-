<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hi po :)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
      font-family: "Courier New", Courier, monospace;
      background: linear-gradient(135deg, #f9e4ec 0%, #f3d9e3 50%, #f8ece4 100%);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-tap-highlight-color: transparent;
    }

    .music-bar {
      width: 100%;
      max-width: 340px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    #musicToggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 18px;
      background: #fff0f6;
      color: #4a2336;
      border: 2px solid #7d4b63;
      border-radius: 999px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(125, 75, 99, 0.18);
      touch-action: manipulation;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    #musicToggle:hover,
    #musicToggle:active {
      background: #ffd6e7;
    }

    #musicToggle:active {
      transform: scale(0.97);
    }

    .window {
      position: relative;
      width: 100%;
      max-width: 340px;
      background: #f8dce8;
      border: 2px solid #7d4b63;
      border-radius: 10px;
      box-shadow: 0 14px 30px rgba(125, 75, 99, 0.22);
      overflow: hidden;
      flex-shrink: 0;
    }

    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #eab8ce;
      border-bottom: 2px solid #7d4b63;
      font-size: 12px;
      font-weight: bold;
      color: #5a2e44;
    }

    .win-controls {
      display: flex;
      gap: 5px;
    }

    .win-controls span {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 1.5px solid #5a2e44;
      background: #fff0f6;
      font-size: 9px;
      line-height: 9px;
      text-align: center;
    }

    .content {
      position: relative;
      min-height: 380px;
      padding: 18px;
      background-image:
        linear-gradient(45deg, rgba(255, 255, 255, 0.45) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.45) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.45) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.45) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .hearts {
      color: #d6336c;
      font-size: 13px;
      letter-spacing: 6px;
    }

    .question {
      font-size: 16px;
      font-weight: bold;
      color: #4a2336;
      line-height: 1.35;
      margin-top: 4px;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 145px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pixel-art style cat built with CSS box-shadow */
    .pixel-cat {
      width: 8px;
      height: 8px;
      background: transparent;
      transform: scale(1.15);
      box-shadow:
        /* Ears */
        16px 8px #18181b, 56px 8px #18181b,
        16px 16px #18181b, 24px 16px #18181b, 48px 16px #18181b, 56px 16px #18181b,
        /* Head */
        16px 24px #18181b, 24px 24px #18181b, 32px 24px #18181b, 40px 24px #18181b, 48px 24px #18181b, 56px 24px #18181b,
        16px 32px #18181b, 24px 32px #fff, 32px 32px #18181b, 40px 32px #18181b, 48px 32px #fff, 56px 32px #18181b,
        16px 40px #18181b, 24px 40px #18181b, 32px 40px #f472b6, 40px 40px #f472b6, 48px 40px #18181b, 56px 40px #18181b,
        /* Body */
        24px 48px #18181b, 32px 48px #18181b, 40px 48px #18181b, 48px 48px #18181b,
        24px 56px #18181b, 32px 56px #9d174d, 40px 56px #9d174d, 48px 56px #18181b,
        24px 64px #18181b, 32px 64px #18181b, 40px 64px #18181b, 48px 64px #18181b;
      position: absolute;
      top: 12px;
      left: 98px;
      pointer-events: none;
    }

    #noBtn {
      position: absolute;
      top: 58px;
      left: 112px;
      padding: 6px 14px;
      background: #ffffff;
      color: #4a2336;
      border: 2px solid #4a2336;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: left 0.12s ease, top 0.12s ease;
      z-index: 2;
      user-select: none;
      touch-action: manipulation;
    }

    .yes-wrap {
      width: 100%;
      padding: 10px;
      border: 1.5px dashed #9d5c7a;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 62px;
    }

    #yesBtn {
      padding: 10px 28px;
      background: #fff0f6;
      color: #4a2336;
      border: 2px solid #4a2336;
      border-radius: 6px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    #yesBtn:hover {
      background: #ffd6e7;
    }

    .response-msg {
      display: none;
      width: 100%;
      font-size: 15px;
      font-weight: bold;
      color: #9d174d;
      padding: 14px;
      background: #fff5f8;
      border: 2px solid #7d4b63;
      border-radius: 8px;
    }

    .time-form {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .time-form input {
      width: 85%;
      padding: 8px 10px;
      border: 1.5px solid #7d4b63;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      text-align: center;
    }

    .time-form button {
      padding: 8px 16px;
      background: #9d174d;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .time-form button:hover {
      background: #7d123d;
    }
  </style>
</head>
<body>
  <div class="music-bar">
    <button id="musicToggle" type="button">🎵 Play Music</button>
  </div>

  <div class="window">
    <div class="title-bar">
      <span>Hi po</span>
      <div class="win-controls">
        <span>_</span>
        <span>□</span>
        <span>×</span>
      </div>
    </div>

    <div class="content" id="cardContent">
      <div>
        <div class="hearts">♥ ♥ ♥</div>
        <p class="question">Tara binondo ♡?</p>
      </div>

      <div class="stage" id="stage">
        <div class="pixel-cat" aria-hidden="true"></div>
        <button id="noBtn" type="button">NO</button>
      </div>

      <div class="yes-wrap" id="yesWrap">
        <button id="yesBtn" type="button">YES</button>
      </div>

      <div class="response-msg" id="responseMsg">
        anong oras po ba ?? hehe ♡
        <div class="time-form" id="timeForm">
          <input type="text" id="timeInput" placeholder="e.g., 4:00 PM / Saturday" />
          <button type="button" id="sendTimeBtn">Send Time</button>
        </div>
        <div id="thankYouText" style="display: none; margin-top: 10px; color: #4a2336;">
           See you po! 🥰
        </div>
      </div>
    </div>
  </div>

  <audio id="bgMusic" src="YK.mp3" autoplay loop playsinline preload="auto"></audio>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const stage = document.getElementById("stage");
    const yesWrap = document.getElementById("yesWrap");
    const responseMsg = document.getElementById("responseMsg");
    const timeInput = document.getElementById("timeInput");
    const sendTimeBtn = document.getElementById("sendTimeBtn");
    const thankYouText = document.getElementById("thankYouText");
    const timeForm = document.getElementById("timeForm");
    const bgMusic = document.getElementById("bgMusic");
    const musicToggle = document.getElementById("musicToggle");

    // Web3Forms Key for Email Alerts
    const WEB3FORMS_ACCESS_KEY = "fd3ca418-7056-4768-82ff-9b409ba196b0";

    const lines = [
      "NO",
      "Are you sure?",
      "Saglit lang nman po!",
      "Please :( !",
      "Catch me!",
      "Try YES instead ♡"
    ];

    let count = 0;
    let userPausedManually = false;
    let noAlertSent = false;

    function sendAlert(eventType, detailsText) {
      if (!WEB3FORMS_ACCESS_KEY) return;

      fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          access_key: WEB3FORMS_ACCESS_KEY,
          subject: `Binondo Invite Alert: ${eventType}`,
          from_name: "Binondo Love Letter",
          message: `${detailsText}\nTimestamp: ${new Date().toLocaleString()}`
        }),
        keepalive: true
      }).catch(err => console.error("Alert error:", err));
    }

    function syncMusicButton() {
      musicToggle.textContent = bgMusic.paused ? "🎵 Play Music" : "🔊 Playing: YK.mp3";
    }

    function playSong() {
      if (!bgMusic || !bgMusic.getAttribute("src")) return Promise.resolve();
      return bgMusic.play()
        .then(() => {
          syncMusicButton();
        })
        .catch(() => {
          syncMusicButton();
        });
    }

    function unlockAudioOnFirstInteraction() {
      if (userPausedManually || !bgMusic.paused) return;
      playSong().then(() => {
        if (!bgMusic.paused) {
          removeInteractionListeners();
        }
      });
    }

    function removeInteractionListeners() {
      document.removeEventListener("touchstart", unlockAudioOnFirstInteraction);
      document.removeEventListener("pointerdown", unlockAudioOnFirstInteraction);
      document.removeEventListener("keydown", unlockAudioOnFirstInteraction);
    }

    document.addEventListener("touchstart", unlockAudioOnFirstInteraction, { passive: true });
    document.addEventListener("pointerdown", unlockAudioOnFirstInteraction, { passive: true });
    document.addEventListener("keydown", unlockAudioOnFirstInteraction);

    window.addEventListener("DOMContentLoaded", () => {
      playSong();
    });

    window.addEventListener("load", () => {
      if (!userPausedManually && bgMusic.paused) {
        playSong();
      }
    });

    function runAway(e) {
      if (e) e.preventDefault();

      const maxX = Math.max(0, stage.clientWidth - noBtn.offsetWidth);
      const maxY = Math.max(0, stage.clientHeight - noBtn.offsetHeight);

      noBtn.style.left = Math.floor(Math.random() * maxX) + "px";
      noBtn.style.top = Math.floor(Math.random() * maxY) + "px";

      count++;
      noBtn.textContent = lines[count % lines.length];

      // Send email alert if they tried NO at least 3 times
      if (count >= 3 && !noAlertSent) {
        noAlertSent = true;
        sendAlert("Dodging NO", `They tried tapping NO (${count} attempts so far).`);
      }

      // Grow YES button safely (max 1.5x scale)
      const scaleVal = Math.min(1.5, 1 + count * 0.08);
      yesBtn.style.transform = `scale(${scaleVal})`;
    }

    function sayYes() {
      noBtn.style.display = "none";
      yesWrap.style.display = "none";
      responseMsg.style.display = "block";
      if (!userPausedManually) {
        playSong();
      }

      sendAlert("Clicked YES 💖", `She clicked YES to "Tara binondo ♡?" after ${count} dodge attempt(s)!`);
    }

    function sendTime() {
      const val = timeInput.value.trim();
      if (!val) return;

      sendAlert("Time Submitted ⏰", `She replied with preferred time: "${val}" (after ${count} NO dodge attempts).`);
      timeForm.style.display = "none";
      thankYouText.style.display = "block";
    }

    musicToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!bgMusic.getAttribute("src")) return;
      if (bgMusic.paused) {
        userPausedManually = false;
        removeInteractionListeners();
        playSong();
      } else {
        userPausedManually = true;
        removeInteractionListeners();
        bgMusic.pause();
        syncMusicButton();
      }
    });

    bgMusic.addEventListener("play", syncMusicButton);
    bgMusic.addEventListener("pause", syncMusicButton);

    // Support both Desktop (mouseenter) and Mobile Touch (touchstart/click)
    noBtn.addEventListener("mouseenter", runAway);
    noBtn.addEventListener("touchstart", runAway, { passive: false });
    noBtn.addEventListener("click", runAway);

    yesBtn.addEventListener("click", sayYes);
    sendTimeBtn.addEventListener("click", sendTime);
  </script>
</body>
</html>
